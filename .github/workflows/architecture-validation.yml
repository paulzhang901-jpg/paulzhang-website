name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm run validate:architecture
      - run: pnpm run test:architecture

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:routes
      - run: pnpm run test:product
      - run: pnpm run test:accessibility
      - run: pnpm run test:performance
      - run: pnpm run build
      - run: pnpm run validate:static-export

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run validate:content
      - run: pnpm run test:content-integrity
      - run: pnpm run test:translation
      - run: node scripts/validate-fiction-ingestion.mjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/security/secret-scan.mjs
      - run: node --test tests/security/secret-scan.test.mjs

  validate:
    if: always()
    needs: [architecture, application, content, security]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce blocking gates
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e 'const needs = JSON.parse(process.env.NEEDS); const failed = Object.entries(needs).filter(([, job]) => job.result !== "success"); if (failed.length) { console.error(failed.map(([name, job]) => `${name}: ${job.result}`).join("\n")); process.exit(1); }'

  production-deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build production static export
        run: pnpm run build
      - name: Validate production static export
        run: pnpm run validate:static-export
      - name: Deploy exact static export to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.131.1 pages deploy out
          --project-name=paulzhang-website-preview
          --branch=production
          --commit-hash=${{ github.sha }}
          --commit-message="production: deploy main ${{ github.sha }}"
      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://paulzhang.org/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://paulzhang.org/library >/dev/null
